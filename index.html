<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>多機能卓上決済端末</title>
  <style>
    :root {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --primary-blue: #3182ce;
      --accent-green: #38a169;
      --accent-purple: #805ad5;
      --accent-red: #e53e3e;
      --accent-orange: #dd6b20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
    }

    /* 1画面に収まるよう縦横・幅を最適化 */
    .terminal-frame {
      width: 100%;
      max-width: 480px;
      height: 94vh;
      max-height: 850px;
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 上部ステータスバー */
    .status-bar {
      height: 38px;
      background-color: #edf2f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 14px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .time-display {
      font-size: 0.9rem;
      font-weight: 700;
    }

    .status-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 2px;
    }

    /* メインボディ */
    .main-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 12px;
      overflow: hidden;
    }

    .store-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f7fafc;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.75rem;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .store-bar strong {
      color: var(--text-main);
    }

    /* 金額表示エリア */
    .display-card {
      background: #ebf8ff;
      border: 2px solid #bee3f8;
      border-radius: 12px;
      padding: 10px 14px;
      text-align: right;
      flex-shrink: 0;
    }

    .display-label {
      font-size: 0.7rem;
      color: #2b6cb0;
      font-weight: 600;
    }

    .display-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #2b6cb0;
      font-family: monospace;
      line-height: 1.2;
    }

    /* 入力フォーム */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .form-group label {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .form-group input {
      background: #f7fafc;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 8px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    /* 9つの角丸ボタン（グリッド配置） */
    .grid-buttons {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 8px;
      min-height: 0;
    }

    .grid-btn {
      border-radius: 12px;
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.1s, opacity 0.1s;
      padding: 4px;
    }

    .grid-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .grid-btn span.icon {
      font-size: 1.1rem;
    }

    /* ボタンの色 */
    .btn-color-1 { background-color: #3182ce; } /* クレジット */
    .btn-color-2 { background-color: #38a169; } /* manaca */
    .btn-color-3 { background-color: #dd6b20; } /* QR/PayPay */
    .btn-color-4 { background-color: #805ad5; } /* 駐車割引 */
    .btn-color-5 { background-color: #d69e2e; } /* ポイント付与 */
    .btn-color-6 { background-color: #319795; } /* 履歴表示 */
    .btn-color-7 { background-color: #e53e3e; } /* クリア */
    .btn-color-8 { background-color: #4a5568; } /* 設定 */
    .btn-color-9 { background-color: #2b6cb0; font-size: 0.85rem; } /* 会計完了 */

    /* ポップアップモーダル（履歴・設定用） */
    .modal-backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .modal-box {
      background: #ffffff;
      width: 90%;
      max-width: 380px;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-height: 80vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1rem;
    }

    .modal-close {
      background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-sub);
    }

    /* モーダル内レシートスタイル */
    .receipt-container {
      background: #fcfcfc;
      border: 1px dashed var(--border-color);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .receipt-header {
      text-align: center;
      font-weight: bold;
      border-bottom: 1px dashed #cbd5e0;
      padding-bottom: 6px;
    }

    .receipt-row {
      display: flex;
      justify-content: space-between;
    }

    .receipt-line {
      border-top: 1px dashed #cbd5e0;
      margin: 2px 0;
    }
  </style>
</head>
<body>

<div class="terminal-frame">
  <!-- 上部ステータスバー -->
  <div class="status-bar">
    <div class="time-display" id="clock-display">18:00</div>
    <div class="status-right">
      <span style="font-size:0.75rem; color:#4a5568;" id="nfc-status">📱 manaca待機</span>
      <button class="icon-btn" onclick="openSettings()" title="設定">⚙️</button>
    </div>
  </div>

  <div class="main-body">
    <div class="store-bar">
      <span>店舗: <strong id="store-name-disp">mozoワンダーシティ店</strong></span>
      <span>レジ: <strong>01</strong></span>
    </div>

    <!-- 金額表示エリア -->
    <div class="display-card">
      <div class="display-label">お支払合計金額</div>
      <div class="display-value" id="amount-disp">¥3,500</div>
    </div>

    <!-- 入力項目 -->
    <div class="form-row">
      <div class="form-group">
        <label>購入金額 (円)</label>
        <input type="number" id="input-amount" value="3500" oninput="syncAmount()">
      </div>
      <div class="form-group">
        <label>車両ナンバー</label>
        <input type="text" id="input-parking" value="Parking_1234">
      </div>
    </div>

    <!-- 9つの角丸カラーボタン（画面内に収まるレスポンシブ） -->
    <div class="grid-buttons">
      <button class="grid-btn btn-color-1" onclick="selectPayment('クレジットカード')">
        <span class="icon">💳</span>クレカ
      </button>
      <button class="grid-btn btn-color-2" onclick="selectPayment('manaca / 交通系IC')">
        <span class="icon">電</span>manaca
      </button>
      <button class="grid-btn btn-color-3" onclick="selectPayment('PayPay / QR')">
        <span class="icon">📱</span>コード決済
      </button>
      <button class="grid-btn btn-color-4" onclick="processParkingOnly()">
        <span class="icon">🚗</span>駐車割引
      </button>
      <button class="grid-btn btn-color-5" onclick="selectPayment('ポイント付与')">
        <span class="icon">🎁</span>ポイント
      </button>
      <button class="grid-btn btn-color-6" onclick="openReceipt()">
        <span class="icon">📄</span>取引履歴
      </button>
      <button class="grid-btn btn-color-7" onclick="resetForm()">
        <span class="icon">🔄</span>クリア
      </button>
      <button class="grid-btn btn-color-8" onclick="openSettings()">
        <span class="icon">⚙️</span>設定
      </button>
      <button class="grid-btn btn-color-9" onclick="processTransaction()">
        <span class="icon">✅</span>会計完了
      </button>
    </div>
  </div>

  <!-- 取引履歴（レシート）ポップアップモーダル -->
  <div class="modal-backdrop" id="receipt-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>📄 最新の取引履歴</span>
        <button class="modal-close" onclick="closeReceipt()">✕</button>
      </div>
      <div class="receipt-container">
        <div class="receipt-header">
          <div id="rec-store">mozoワンダーシティ店</div>
          <div style="font-size:0.7rem; font-weight:normal; color:#718096;">卓上決済端末 お控え</div>
        </div>
        <div class="receipt-row">
          <span>取引日時:</span>
          <span id="rec-date">未処理</span>
        </div>
        <div class="receipt-line"></div>
        <div class="receipt-row" style="font-weight:bold; font-size:0.9rem;">
          <span>お買上額:</span>
          <span id="rec-amount">¥0</span>
        </div>
        <div class="receipt-row">
          <span>決済方式:</span>
          <span id="rec-method">-</span>
        </div>
        <div class="receipt-line"></div>
        <div class="receipt-row">
          <span>付与ポイント:</span>
          <span id="rec-points">0 pt</span>
        </div>
        <div class="receipt-line"></div>
        <div style="font-weight:bold; margin-top:2px;">【駐車場サービス】</div>
        <div class="receipt-row">
          <span>車番:</span>
          <span id="rec-car">-</span>
        </div>
        <div class="receipt-row">
          <span>割引適用:</span>
          <span id="rec-discount">-</span>
        </div>
      </div>
      <button class="grid-btn btn-color-1" style="height:38px; width:100%; border-radius:8px;" onclick="closeReceipt()">閉じる</button>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span>⚙️ 端末設定</span>
        <button class="modal-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="form-group">
        <label>店舗名</label>
        <input type="text" id="setting-store-input" value="mozoワンダーシティ店">
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:6px;">
        <button class="grid-btn btn-color-1" style="height:40px; width:100%; border-radius:8px;" onclick="saveSettings()">設定を保存</button>
        <button class="grid-btn btn-color-7" style="height:40px; width:100%; border-radius:8px;" onclick="logout()">ログアウト</button>
      </div>
    </div>
  </div>
</div>

<script>
  let selectedMethod = 'manaca / 交通系IC';

  // 効果音（ピピッ）
  function playSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(1800, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e){}
  }

  // 時計
  function updateClock() {
    const now = new Date();
    document.getElementById('clock-display').innerText = 
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }
  setInterval(updateClock, 1000);
  updateClock();

  function syncAmount() {
    const val = Number(document.getElementById('input-amount').value) || 0;
    document.getElementById('amount-disp').innerText = '¥' + val.toLocaleString();
  }

  function selectPayment(name) {
    playSound();
    selectedMethod = name;
    alert(`決済種別: 【${name}】 を選択しました`);
  }

  function calcParking(input, amount) {
    const match = input.match(/^Parking_(\d{1,4})$/i);
    if (!match) return { car: '-', hours: 0 };
    const car = match[1];
    let hours = 0;
    if (amount >= 5000) hours = 3;
    else if (amount >= 3000) hours = 2;
    else if (amount >= 1000) hours = 1;
    return { car, hours };
  }

  // 会計完了
  function processTransaction() {
    playSound();
    const amount = Number(document.getElementById('input-amount').value) || 0;
    const parkingInput = document.getElementById('input-parking').value;
    const points = Math.floor(amount * 0.01);
    const parking = calcParking(parkingInput, amount);

    const now = new Date();
    document.getElementById('rec-date').innerText = now.toLocaleString('ja-JP');
    document.getElementById('rec-amount').innerText = '¥' + amount.toLocaleString();
    document.getElementById('rec-method').innerText = selectedMethod;
    document.getElementById('rec-points').innerText = points + ' pt';
    document.getElementById('rec-car').innerText = parking.car;
    document.getElementById('rec-discount').innerText = parking.hours > 0 ? `${parking.hours}時間無料` : 'なし';

    alert(`決済完了！\n付与ポイント: +${points}pt\n駐車割引: ${parking.hours}時間無料`);
  }

  // 駐車割引のみ
  function processParkingOnly() {
    playSound();
    const amount = Number(document.getElementById('input-amount').value) || 0;
    const parkingInput = document.getElementById('input-parking').value;
    const parking = calcParking(parkingInput, amount);

    document.getElementById('rec-car').innerText = parking.car;
    document.getElementById('rec-discount').innerText = parking.hours > 0 ? `${parking.hours}時間無料` : 'なし';
    alert(`車両【${parking.car}】: ${parking.hours}時間無料サービスを適用しました`);
  }

  function resetForm() {
    document.getElementById('input-amount').value = '3500';
    document.getElementById('input-parking').value = 'Parking_1234';
    syncAmount();
  }

  // 取引履歴モーダル開閉
  function openReceipt() {
    document.getElementById('receipt-modal').style.display = 'flex';
  }
  function closeReceipt() {
    document.getElementById('receipt-modal').style.display = 'none';
  }

  // 設定モーダル開閉
  function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
  function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }
  function saveSettings() {
    const val = document.getElementById('setting-store-input').value;
    document.getElementById('store-name-disp').innerText = val;
    document.getElementById('rec-store').innerText = val;
    closeSettings();
  }
  function logout() { location.reload(); }

  // Android Web NFC
  async function initNFC() {
    if ('NDEFReader' in window) {
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        ndef.addEventListener("reading", () => {
          selectedMethod = 'manaca (NFC検知)';
          processTransaction();
        });
      } catch(e){}
    }
  }
  window.addEventListener('load', initNFC);
</script>

</body>
</html>

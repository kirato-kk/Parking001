<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>卓上決済端末</title>
  <!-- jsQRライブラリ（カメラでQRコードを読み取る用） -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    :root {
      --bg-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-main: #2d3748;
      --text-sub: #718096;
      --border-color: #e2e8f0;
      --primary-blue: #3182ce;
      --accent-green: #38a169;
      --accent-purple: #805ad5;
      --accent-red: #e53e3e;
      --accent-orange: #dd6b20;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 8px;
    }

    .terminal-frame {
      width: 100%;
      max-width: 420px;
      height: 94vh;
      max-height: 800px;
      background-color: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* 上部ステータスバー（右上に歯車⚙️のみ） */
    .status-bar {
      height: 44px;
      background-color: #edf2f7;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .time-display {
      font-size: 0.95rem;
      font-weight: 700;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
    }

    /* 各画面コンテナ */
    .screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
      overflow-y: auto;
    }

    .hidden { display: none !important; }

    /* 1. 店舗名入力画面（初期画面） */
    .login-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
    }

    .login-title {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      color: var(--primary-blue);
    }

    /* 店舗名バー */
    .store-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #f7fafc;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 0.85rem;
      color: var(--text-sub);
      flex-shrink: 0;
    }

    .store-bar strong { color: var(--text-main); }

    /* 9つの角丸ボタン（グリッド配置） */
    .grid-buttons {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 10px;
      min-height: 0;
    }

    .grid-btn {
      border-radius: 14px;
      border: none;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      transition: transform 0.1s, opacity 0.1s;
      padding: 4px;
    }

    .grid-btn:active {
      transform: scale(0.96);
      opacity: 0.9;
    }

    .grid-btn span.icon { font-size: 1.3rem; }

    /* ボタン配色 */
    .btn-color-1 { background-color: #3182ce; } /* クレジット */
    .btn-color-2 { background-color: #38a169; } /* manaca */
    .btn-color-3 { background-color: #dd6b20; } /* QR/PayPay */
    .btn-color-4 { background-color: #805ad5; } /* 駐車割引 */
    .btn-color-5 { background-color: #d69e2e; } /* ポイント */
    .btn-color-6 { background-color: #319795; } /* 電子マネー */
    .btn-color-7 { background-color: #e53e3e; } /* 取消 */
    .btn-color-8 { background-color: #718096; } /* その他 */
    .btn-color-9 { background-color: #2b6cb0; } /* 会計 */

    /* 汎用入力スタイル */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    .form-group input {
      background: #f7fafc;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
    }

    .action-btn {
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--primary-blue);
      color: #fff;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }

    /* ポップアップモーダル */
    .modal-backdrop {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 50;
    }

    .modal-box {
      background: #ffffff;
      width: 90%;
      max-width: 380px;
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      max-height: 85vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.05rem;
    }

    .modal-close {
      background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-sub);
    }

    /* QRコードカメラ用エリア */
    #camera-container {
      width: 100%;
      height: 220px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      position: relative;
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* NFCタッチ待機アニメーション */
    .touch-wave-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      gap: 12px;
    }

    .touch-icon {
      font-size: 3.5rem;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
  </style>
</head>
<body>

<div class="terminal-frame">
  <!-- 上部ステータスバー（右上に⚙️のみ） -->
  <div class="status-bar">
    <div class="time-display" id="clock-display">18:00</div>
    <button class="icon-btn" onclick="openSettingsModal()" title="設定">⚙️</button>
  </div>

  <!-- 【画面A】一番始めの画面：店舗入力画面（ログイン画面） -->
  <div class="screen" id="screen-login">
    <div class="login-container">
      <div class="login-title">🏪 卓上決済端末 初期設定</div>
      <div class="form-group">
        <label>店舗名を入力してください</label>
        <input type="text" id="login-store-name" value="mozoワンダーシティ店" placeholder="例: ○○店">
      </div>
      <button class="action-btn" onclick="submitLogin()">店舗を登録して起動</button>
    </div>
  </div>

  <!-- 【画面B】メイン画面：9個の角丸ボタンのみ（金額等の表示なし） -->
  <div class="screen hidden" id="screen-main">
    <div class="store-bar">
      <span>店舗: <strong id="main-store-disp">-</strong></span>
      <span>レジ: <strong>01</strong></span>
    </div>

    <div class="grid-buttons">
      <button class="grid-btn btn-color-1" onclick="alert('クレジットカード決済を選択しました')">
        <span class="icon">💳</span>クレカ
      </button>
      <button class="grid-btn btn-color-2" onclick="startManacaFlow()">
        <span class="icon">電</span>マナカ
      </button>
      <button class="grid-btn btn-color-3" onclick="alert('コード決済を選択しました')">
        <span class="icon">📱</span>コード決済
      </button>
      <button class="grid-btn btn-color-4" onclick="startParkingFlow()">
        <span class="icon">🚗</span>駐車場割引
      </button>
      <button class="grid-btn btn-color-5" onclick="alert('ポイント処理を選択しました')">
        <span class="icon">🎁</span>ポイント
      </button>
      <button class="grid-btn btn-color-6" onclick="alert('電子マネーを選択しました')">
        <span class="icon">📶</span>電子マネー
      </button>
      <button class="grid-btn btn-color-7" onclick="playSound()">
        <span class="icon">🔄</span>取消
      </button>
      <button class="grid-btn btn-color-8" onclick="alert('その他機能')">
        <span class="icon">📋</span>その他
      </button>
      <button class="grid-btn btn-color-9" onclick="alert('会計完了')">
        <span class="icon">✅</span>会計完了
      </button>
    </div>
  </div>

  <!-- 【モーダル1】駐車場割引フロー -->
  <div class="modal-backdrop" id="modal-parking">
    <div class="modal-box">
      <div class="modal-header">
        <span>🚗 駐車場割引</span>
        <button class="modal-close" onclick="closeParkingModal()">✕</button>
      </div>

      <!-- ステップ1: カメラ起動＆QRコードスキャン -->
      <div id="parking-step-1">
        <p style="font-size:0.85rem; color:var(--text-sub); margin-bottom:8px;">Parking_1234のQRコードをかざしてください</p>
        <div id="camera-container">
          <video id="video" playsinline></video>
        </div>
      </div>

      <!-- ステップ2: 車両ナンバー確認 & 金額入力 -->
      <div id="parking-step-2" class="hidden">
        <div class="form-group">
          <label>お車ナンバー</label>
          <input type="text" id="parking-car-no" readonly style="background:#edf2f7; font-weight:bold; color:#2b6cb0;">
        </div>
        <div class="form-group" style="margin-top:8px;">
          <label>お会計金額 (円)</label>
          <input type="number" id="parking-amount" value="3500" placeholder="金額を入力">
        </div>
        <button class="action-btn" style="background:var(--accent-purple); margin-top:10px;" onclick="completeParkingDiscount()">割引適用完了</button>
      </div>
    </div>
  </div>

  <!-- 【モーダル2】マナカ決済フロー -->
  <div class="modal-backdrop" id="modal-manaca">
    <div class="modal-box">
      <div class="modal-header">
        <span>💳 マナカお支払い</span>
        <button class="modal-close" onclick="closeManacaModal()">✕</button>
      </div>

      <!-- ステップ1: 金額入力 -->
      <div id="manaca-step-1">
        <div class="form-group">
          <label>お会計金額を入力してください (円)</label>
          <input type="number" id="manaca-amount" value="3500" placeholder="金額を入力">
        </div>
        <button class="action-btn" style="background:var(--accent-green); margin-top:12px;" onclick="goToManacaTouch()">次へ（タッチ待機）</button>
      </div>

      <!-- ステップ2: 背面タッチ待機 -->
      <div id="manaca-step-2" class="hidden">
        <div class="touch-wave-box">
          <div class="touch-icon">📱</div>
          <p style="font-weight:bold; font-size:1rem;">スマホの背面にタッチして下さい</p>
          <p style="font-size:0.8rem; color:var(--text-sub);" id="nfc-guide-text">manacaを端末裏面にかざしてください...</p>
        </div>
        <button class="action-btn" style="background:var(--border-color); color:var(--text-main);" onclick="simulateNFCSuccess()">画面タッチでテスト反応</button>
      </div>
    </div>
  </div>

  <!-- 【モーダル3】設定モーダル（ログアウト対応） -->
  <div class="modal-backdrop" id="modal-settings">
    <div class="modal-box">
      <div class="modal-header">
        <span>⚙️ 端末設定</span>
        <button class="modal-close" onclick="closeSettingsModal()">✕</button>
      </div>
      <div class="form-group">
        <label>店舗名</label>
        <input type="text" id="setting-store-input">
      </div>
      <button class="action-btn" onclick="saveStoreSettings()">設定を保存</button>
      <button class="action-btn" style="background:var(--accent-red);" onclick="logout()">ログアウト（ログイン画面へ）</button>
    </div>
  </div>
</div>

<!-- 隠しキャンバス（QRコード解析用） -->
<canvas id="qr-canvas" style="display:none;"></canvas>

<script>
  let currentStoreName = "";
  let videoStream = null;
  let qrAnimationId = null;

  // 効果音（ピピッ！）
  function playSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(1800, ctx.currentTime);
      gain.gain.setValueAtTime(0.1, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e){}
  }

  // 時計更新
  function updateClock() {
    const now = new Date();
    document.getElementById('clock-display').innerText = 
      String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // 1. 店舗入力・ログイン処理
  function submitLogin() {
    const val = document.getElementById('login-store-name').value.trim();
    if(!val) {
      alert('店舗名を入力してください');
      return;
    }
    currentStoreName = val;
    document.getElementById('main-store-disp').innerText = currentStoreName;
    document.getElementById('setting-store-input').value = currentStoreName;

    document.getElementById('screen-login').classList.add('hidden');
    document.getElementById('screen-main').classList.remove('hidden');
  }

  // 2. 駐車場割引フロー
  function startParkingFlow() {
    document.getElementById('parking-step-1').classList.remove('hidden');
    document.getElementById('parking-step-2').classList.add('hidden');
    document.getElementById('modal-parking').style.display = 'flex';

    // カメラ起動
    const video = document.getElementById('video');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
      .then((stream) => {
        videoStream = stream;
        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        video.play();
        requestAnimationFrame(scanQRCode);
      })
      .catch((err) => {
        alert("カメラの起動に失敗しました: " + err);
      });
  }

  // QRコードのリアルタイム検出
  function scanQRCode() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('qr-canvas');
    const ctx = canvas.getContext('2d');

    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.height = video.videoHeight;
      canvas.width = video.videoWidth;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, {
        inversionAttempts: "dontInvert",
      });

      if (code && code.data) {
        // 例: "Parking_1234" から "1234" を抽出
        const match = code.data.match(/^Parking_(\d{1,4})$/i);
        if (match) {
          playSound();
          stopCamera();
          document.getElementById('parking-car-no').value = match[1];
          document.getElementById('parking-step-1').classList.add('hidden');
          document.getElementById('parking-step-2').classList.remove('hidden');
          return;
        }
      }
    }
    qrAnimationId = requestAnimationFrame(scanQRCode);
  }

  function stopCamera() {
    if (qrAnimationId) cancelAnimationFrame(qrAnimationId);
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
  }

  function completeParkingDiscount() {
    playSound();
    const carNo = document.getElementById('parking-car-no').value;
    const amount = document.getElementById('parking-amount').value;
    closeParkingModal();
    alert(`【割引適用完了】\nお車ナンバー: ${carNo}\nお会計金額: ¥${Number(amount).toLocaleString()}`);
  }

  function closeParkingModal() {
    stopCamera();
    document.getElementById('modal-parking').style.display = 'none';
  }

  // 3. マナカ決済フロー
  function startManacaFlow() {
    document.getElementById('manaca-step-1').classList.remove('hidden');
    document.getElementById('manaca-step-2').classList.add('hidden');
    document.getElementById('modal-manaca').style.display = 'flex';
  }

  function goToManacaTouch() {
    const amount = document.getElementById('manaca-amount').value;
    if (!amount || amount <= 0) {
      alert('正しいお会計金額を入力してください');
      return;
    }
    document.getElementById('manaca-step-1').classList.add('hidden');
    document.getElementById('manaca-step-2').classList.remove('hidden');

    // NFCスキャン待機
    startNFCListener();
  }

  // Web NFCスキャン
  async function startNFCListener() {
    if ('NDEFReader' in window) {
      try {
        const ndef = new NDEFReader();
        await ndef.scan();
        ndef.addEventListener("reading", () => {
          onNFCSuccess();
        });
      } catch (e) {
        document.getElementById('nfc-guide-text').innerText = 'NFCが利用できません（画面タップでテスト可）';
      }
    }
  }

  // タッチ反応成功処理
  function onNFCSuccess() {
    playSound(); // 音が鳴る
    const amount = document.getElementById('manaca-amount').value;
    closeManacaModal();
    alert(`【お支払い完了】\nマナカ決済額: ¥${Number(amount).toLocaleString()}`);
  }

  function simulateNFCSuccess() {
    onNFCSuccess();
  }

  function closeManacaModal() {
    document.getElementById('modal-manaca').style.display = 'none';
  }

  // 4. 設定 ＆ ログアウト
  function openSettingsModal() {
    document.getElementById('modal-settings').style.display = 'flex';
  }

  function closeSettingsModal() {
    document.getElementById('modal-settings').style.display = 'none';
  }

  function saveStoreSettings() {
    const val = document.getElementById('setting-store-input').value.trim();
    if(val) {
      currentStoreName = val;
      document.getElementById('main-store-disp').innerText = currentStoreName;
      closeSettingsModal();
      alert('店舗名を更新しました');
    }
  }

  // ログアウト：一番最初の店舗入力画面（ログイン画面）へ戻る
  function logout() {
    closeSettingsModal();
    document.getElementById('screen-main').classList.add('hidden');
    document.getElementById('screen-login').classList.remove('hidden');
  }
</script>

</body>
            </html>
